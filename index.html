<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <title>demo</title>
</head>

<body>
  <!--區塊元素(例如h1~h6)會將自身左右邊的內容都佔據-->
  <style>
    h1 {
      color: darkgreen;
    }
  </style>
  <h1>你</h1>
  <h1>好</h1>
  <!-- 行內元素(例如span)只會佔據自身裡面的內容大小-->
  <span>你</span>
  <span>好</span>
  <a href="https://www.google.com/">Facebook</a>
  <a href="https://www.facebook.com/">Google</a>
  <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQT30hcg8jgEelje7SNc-Btsud8JdcwqKMUauy3IZz1PQ&s=10;">
</body>


</html>
